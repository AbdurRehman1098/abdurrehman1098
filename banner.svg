<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Abdur Rehman banner">
  <defs>
    <linearGradient id="bgfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161F"/><stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="230" rx="18" fill="url(#bgfade)"/>
  <rect x="0.5" y="0.5" width="999" height="229" rx="17.5" fill="none" stroke="#1B2230"/>

  <text x="500" y="74" text-anchor="middle" fill="#8B949E" font-size="17" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" opacity="0">
    ~/abdur-rehman<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.25s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    <text x="500" y="135" text-anchor="middle" fill="#F3F6FA" font-size="66" font-weight="700" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" letter-spacing="1">Abdur Rehman</text>
  </g>

  <line x1="500" y1="158" x2="500" y2="158" stroke="#FF5D3B" stroke-width="4" stroke-linecap="round" stroke-dasharray="190" stroke-dashoffset="190">
    <animate attributeName="stroke-dashoffset" from="190" to="0" dur="0.7s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    <animate attributeName="x1" from="500" to="405" dur="0.7s" begin="0.7s" fill="freeze"/>
    <animate attributeName="x2" from="500" to="595" dur="0.7s" begin="0.7s" fill="freeze"/>
  </line>

  <text x="500" y="186" text-anchor="middle" fill="#FF7A4D" font-size="21" font-weight="600" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" opacity="0">
    CEO &amp; Developer · Fizzy Studios
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.95s" fill="freeze"/>
  </text>
  <text x="500" y="212" text-anchor="middle" fill="#51607F" font-size="14" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" opacity="0">
    React · Node · TypeScript · Java
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
  </text>
</svg>
